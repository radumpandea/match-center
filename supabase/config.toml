# Minimal Supabase CLI project file -- only here so `supabase functions deploy`
# works from CI. The database schema lives in docs/supabase.sql (run by hand in
# the dashboard), not in migrations.
project_id = "match-center"

[functions.api-lineups]
# Callers must present a valid JWT; the function itself additionally requires a
# signed-in user (not just the public anon key).
verify_jwt = true

[functions.live-poll]
# Called by pg_cron from the database (no user). It protects the API quota itself (mc_live_claim in supabase/live.sql).
verify_jwt = false
