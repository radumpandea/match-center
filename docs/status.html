<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Center — Stare joburi</title>
<script>(function(){try{var v=localStorage.getItem('mc:theme');if(v!=='light'&&v!=='dark'){v=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',v);}catch(e){}})();</script>
<style>
  :root{--bg:#161826;--surface:#232532;--text:#e9e9ed;--muted:#9397ab;--accent:#d2cefd;--line:rgba(233,233,237,.16);--ok:#3fa66b;--bad:#e5534b;--warn:#c9a227}
  :root[data-theme="light"]{--bg:#f5f5fa;--surface:#fff;--text:#1c1b24;--muted:#5e6175;--accent:#5b3dae;--line:rgba(28,27,36,.16);--ok:#1f8a4c;--bad:#c62f27;--warn:#8a6d00}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Inter",sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:22px 16px 60px}
  a{color:var(--accent)}
  h1{font-size:24px;margin:10px 0 4px}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid currentColor}
  .ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
  .muted{color:var(--muted)}
  .box{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:14px}
  @media(max-width:640px){th:nth-child(4),td:nth-child(4){display:none}}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html">← Înapoi la meciuri</a>
  <h1>Stare joburi automate</h1>
  <p class="sub" id="sub">Se încarcă…</p>
  <div id="summary"></div>
  <table id="tbl" hidden>
    <thead><tr><th>Job</th><th>Ultima rulare</th><th>Ultimul succes</th><th>Eșecuri (7 zile)</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
<script>
(function () {
  function ago(iso) {
    if (!iso) return '—';
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 2) return 'acum un minut';
    if (m < 90) return 'acum ' + m + ' min';
    var h = Math.round(m / 60);
    if (h < 36) return 'acum ' + h + ' h';
    return 'acum ' + Math.round(h / 24) + ' zile';
  }
  function td(node) { var c = document.createElement('td'); if (typeof node === 'string') c.textContent = node; else c.appendChild(node); return c; }
  fetch('data/health.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(function (h) {
    var sub = document.getElementById('sub');
    if (!h) { sub.textContent = 'Raportul nu e disponibil încă (se generează la fiecare 6 ore).'; return; }
    sub.textContent = 'Raport generat ' + ago(h.generatedAt) + '. Joburile pornite doar manual nu intră în alertă.';
    var box = document.createElement('div');
    box.className = 'box';
    if (h.failing && h.failing.length) { box.innerHTML = '<b class="bad">⚠ Au eșuat la ultima rulare:</b> ' + h.failing.map(function (n) { return n.replace(/</g, '&lt;'); }).join(', '); }
    else { box.innerHTML = '<b class="ok">✓ Nicio problemă la ultimele rulări ale joburilor automate.</b>'; }
    document.getElementById('summary').appendChild(box);
    var tb = document.querySelector('#tbl tbody');
    (h.workflows || []).forEach(function (w) {
      var tr = document.createElement('tr');
      var name = document.createElement('span'); name.textContent = w.name + (w.manual ? ' (manual)' : '');
      var pill = document.createElement('a');
      pill.href = w.last.url; pill.target = '_blank'; pill.rel = 'noopener';
      pill.className = 'pill ' + (w.last.conclusion === 'success' ? 'ok' : w.last.conclusion === 'failure' ? 'bad' : 'warn');
      pill.textContent = (w.last.conclusion === 'success' ? 'ok' : w.last.conclusion === 'failure' ? 'eșuat' : w.last.conclusion) + ' · ' + ago(w.last.at);
      tr.appendChild(td(name)); tr.appendChild(td(pill)); tr.appendChild(td(ago(w.lastSuccessAt)));
      var f = td(w.failures7d + ' din ' + w.runs7d); if (w.failures7d) f.className = 'bad';
      tr.appendChild(f);
      tb.appendChild(tr);
    });
    document.getElementById('tbl').hidden = false;
  });
})();
</script>
</body>
</html>
