<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Center — Ajutor</title>
<script>(function(){try{var v=localStorage.getItem('mc:theme');if(v!=='light'&&v!=='dark'){v=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',v);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --color-bg:#161826;
    --color-surface:#232532;
    --color-text:#e9e9ed;
    --color-accent:#9184d9;
    --color-divider:color-mix(in srgb,#e9e9ed 16%,transparent);
    --color-neutral-400:#b2b6ca;
    --color-neutral-500:#9397ab;
    --color-neutral-600:#75798c;
    --color-accent-200:#e7e5fe;
    --color-accent-300:#d2cefd;
    --space-1:2.8px;--space-2:5.6px;--space-3:8.4px;--space-4:11.2px;--space-6:16.8px;--space-8:22.4px;
    --radius-sm:4px;--radius-md:8px;--radius-lg:14px;
  }
  :root[data-theme="light"]{
    --color-bg:#f5f5fa;
    --color-surface:#ffffff;
    --color-text:#1c1b24;
    --color-accent:#6d28d9;
    --color-divider:color-mix(in srgb,#1c1b24 16%,transparent);
    --color-neutral-400:#45485a;
    --color-neutral-500:#5e6175;
    --color-neutral-600:#82859a;
    --color-accent-200:#4c2e99;
    --color-accent-300:#5b3dae;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:"Inter",system-ui,sans-serif;font-size:15px;line-height:1.6}
  a{color:var(--color-accent-300);text-decoration:none}
  a:hover{color:var(--color-accent-200);text-decoration:underline}
  .page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 var(--space-6)}
  .wrap{width:100%;max-width:860px;display:flex;flex-direction:column;gap:var(--space-6);padding:var(--space-8) 0 calc(var(--space-8) * 2)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}
  .kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-neutral-500);font-weight:600}
  .kicker .dot{margin:0 6px;color:var(--color-accent)}
  .tools{display:flex;align-items:center;gap:var(--space-2)}
  h1{margin:0;font-size:26px;line-height:1.25;font-weight:600}
  .intro{margin:0;color:var(--color-neutral-400);text-wrap:pretty}
  .back{font-size:13.5px}
  .toc{display:flex;flex-wrap:wrap;gap:var(--space-2);padding:var(--space-4);border:1px solid var(--color-divider);border-radius:var(--radius-md);background:var(--color-surface)}
  .toc-title{width:100%;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-500);font-weight:600}
  .toc a{font-size:13px;padding:3px 10px;border:1px solid var(--color-divider);border-radius:999px;color:var(--color-neutral-400)}
  .toc a:hover{border-color:var(--color-accent);color:var(--color-accent-200);text-decoration:none}
  section.card{border:1px solid var(--color-divider);border-radius:var(--radius-lg);background:var(--color-surface);padding:var(--space-6);scroll-margin-top:var(--space-6)}
  section.card h2{margin:0 0 var(--space-3);font-size:18px;font-weight:600}
  section.card .sec-intro{margin:0 0 var(--space-3);color:var(--color-neutral-400);font-size:14px}
  dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-3)}
  dt{font-weight:600;font-size:14px;color:var(--color-accent-300)}
  dd{margin:2px 0 0;font-size:14.5px;color:var(--color-text);text-wrap:pretty}
  .row{padding-bottom:var(--space-3);border-bottom:1px dashed var(--color-divider)}
  .row:last-child{border-bottom:none;padding-bottom:0}
  .foot{font-size:12.5px;color:var(--color-neutral-600);border-top:1px solid var(--color-divider);padding-top:var(--space-4)}
  .mc-theme-toggle{font-size:13px;line-height:1;width:26px;height:26px;padding:0;border-radius:50%;cursor:pointer;background:transparent;color:var(--color-neutral-400);border:1px solid var(--color-divider)}
  .mc-theme-toggle:hover{border-color:var(--color-accent);color:var(--color-accent-200)}
  @media (max-width:560px){h1{font-size:22px}section.card{padding:var(--space-4)}}
  @media print{.tools,.toc{display:none}body{background:#fff;color:#000}section.card{break-inside:avoid;border-color:#bbb;background:#fff}dt{color:#000}}
</style>
</head>
<body>
<div class="page">
  <div class="wrap">
    <div class="top">
      <div class="kicker">MATCH<span class="dot">·</span>CENTER</div>
      <div class="tools">
        <div id="themeSwitchHost"></div>
        <div id="langSwitchHost"></div>
      </div>
    </div>
    <a class="back" id="backLink" href="index.html">← Înapoi la meciuri</a>
    <h1 id="pageTitle"></h1>
    <p class="intro" id="pageIntro"></p>
    <nav class="toc" id="toc" aria-label=""></nav>
    <div id="content"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script src="app/i18n.js?v=20261030a"></script>
<script src="app/theme.js?v=20260917c"></script>
<script src="app/help-content.js?v=20261030a"></script>
<script>
(function () {
  'use strict';
  var I = window.MC_I18N;

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function render() {
    var lang = I.getLang();
    var c = (window.MC_HELP && (window.MC_HELP[lang] || window.MC_HELP.ro)) || null;
    if (!c) return;
    document.documentElement.setAttribute('lang', lang);
    document.title = 'Match Center — ' + c.title;
    document.getElementById('pageTitle').textContent = c.title;
    document.getElementById('pageIntro').textContent = c.intro;
    document.getElementById('backLink').textContent = c.back;
    document.getElementById('foot').textContent = c.footer;

    var toc = document.getElementById('toc');
    toc.innerHTML = '';
    toc.setAttribute('aria-label', c.toc);
    toc.appendChild(el('div', { 'class': 'toc-title', text: c.toc }));
    c.sections.forEach(function (s) { toc.appendChild(el('a', { href: '#' + s.id, text: s.h })); });

    var host = document.getElementById('content');
    host.innerHTML = '';
    host.style.display = 'flex';
    host.style.flexDirection = 'column';
    host.style.gap = 'var(--space-6)';
    c.sections.forEach(function (s) {
      var dl = el('dl');
      s.items.forEach(function (it) {
        dl.appendChild(el('div', { 'class': 'row' }, [el('dt', { text: it[0] }), el('dd', { text: it[1] })]));
      });
      host.appendChild(el('section', { 'class': 'card', id: s.id }, [
        el('h2', { text: s.h }),
        s.intro ? el('p', { 'class': 'sec-intro', text: s.intro }) : null,
        dl
      ]));
    });
  }

  document.getElementById('langSwitchHost').appendChild(I.switcherEl(render));
  document.getElementById('themeSwitchHost').appendChild(window.MC_THEME.toggleEl());
  window.addEventListener('mc-lang-changed', render);
  render();
})();
</script>
</body>
</html>
