<!-- Bump the ?v= on the two app/ assets below on every change to them —
     GitHub Pages caches assets for 10 min, so this forces browsers to refetch. -->

<!-- Apply the stored/detected background theme before first paint, so there
     is no dark->light (or vice versa) flash once app/theme.js loads. -->
<script>(function(){try{var v=localStorage.getItem('mc:theme');if(v!=='light'&&v!=='dark'){v=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',v);}catch(e){}})();</script>
