name: Deploy Supabase Functions

# Deploys supabase/functions/* (today: api-lineups, the on-demand lineup lookup
# behind the "Aliniere din API" button) and keeps its APIFOOTBALL_KEY secret in
# step with the GitHub secret of the same name. Needs one extra repository
# secret, SUPABASE_ACCESS_TOKEN (a personal access token from
# https://supabase.com/dashboard/account/tokens); without it the job only says
# so and exits cleanly, it never fails the push.
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check prerequisites
        id: pre
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set - skipping the Supabase function deploy. Add it as a repository secret to enable the 'Aliniere din API' button."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SUPABASE_URL" ]; then
            echo "::notice::SUPABASE_URL is not set - cannot work out the project ref."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.pre.outputs.ready == 'true'
        with:
          version: latest

      - name: Deploy api-lineups and set its secret
        if: steps.pre.outputs.ready == 'true'
        run: |
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')
          supabase secrets set APIFOOTBALL_KEY="$APIFOOTBALL_KEY" --project-ref "$REF"
          supabase functions deploy api-lineups --project-ref "$REF"
