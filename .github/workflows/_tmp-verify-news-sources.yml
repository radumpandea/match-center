name: TMP verify news sources plumbing
on:
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Syntax-check touched scripts
        run: |
          node --check scripts/prefetch-preview.mjs
          node --check scripts/news-sources.mjs
          echo "syntax OK"
      - name: Integration check -- team-name filtering against real feeds
        run: node scripts/_tmp-test-teamnews.mjs
      - name: Validate every existing match file against the schema
        run: node scripts/validate-match.mjs docs/data/matches/*.json
