name: Build Player Facts

# Fun facts per player (docs/data/players/<apiId>.json), as their own small job.
# Researching them inside the match build only ever reached a few players per match
# (a shared lookup budget); here a run does nothing else: it takes the next batch of
# likely starters who still have none (premium matches first, soonest kick-off first,
# see scripts/pick-player-facts.mjs), researches them with the cheap model, and copies
# the result into every pack that contains them (scripts/apply-player-facts.mjs).
# Before the model starts, scripts/resolve-player-sources.mjs finds each player's
# Wikipedia article and Wikidata record (deterministic, free) and saves the text, so the
# model reads it instead of searching: fewer lookups per player, no same-name mix-ups.
# Gradual on purpose: PER_RUN players a run, three runs a day. Shares the Claude
# subscription limits with every other run, so keep it small.
#
# Also called by build-match-data-run.yml right after a premium (deep) pack is built, with
# only_slug set: it then researches exactly that match's starters, so a premium pack is
# complete in one go. The daily queue stays as the net for everything else.
on:
  schedule:
    - cron: "50 9,14,19 * * *"
  workflow_dispatch:
    inputs:
      per_run:
        description: "Players to research in this run"
        required: false
        default: "18"
      only_slug:
        description: "Research only this match's starters (empty = the queue)"
        required: false
        default: ""
  workflow_call:
    inputs:
      per_run:
        required: false
        type: string
        default: "30"
      only_slug:
        required: false
        type: string
        default: ""

# One queue run at a time; a per-match run has its own group so it never cancels (or is
# cancelled by) a queued run.
concurrency:
  group: player-facts-${{ inputs.only_slug || 'queue' }}
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      players: ${{ steps.pick.outputs.players }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Pick the next players without facts
        id: pick
        env:
          PER_RUN: ${{ inputs.per_run || '18' }}
          ONLY_SLUG: ${{ inputs.only_slug }}
        run: node scripts/pick-player-facts.mjs

  research:
    needs: pick
    if: needs.pick.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find each player's Wikipedia article and Wikidata record
        env:
          PLAYERS: ${{ needs.pick.outputs.players }}
        run: node scripts/resolve-player-sources.mjs

      - uses: anthropics/claude-code-action@v1
        id: claude-facts
        continue-on-error: true
        with:
          claude_code_oauth_token: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}"
          show_full_output: true
          prompt: |
            You research short biographical "fun facts" about football players for a
            commentator's Match Center. You run unattended in one shot: do everything
            yourself, now, in this turn (no background agents), then stop.

            ## Players (JSON: apiId, name, team, slug of a match they are in)
            ${{ needs.pick.outputs.players }}

            ## What to do, for EACH player
            A script has already looked each player up: read
            `.player-sources/<apiId>.txt` for him. It holds the text of his Wikipedia
            article (the URL is on its first line) and what Wikidata knows (birth date,
            clubs with years). Base the facts on that text and cite its URL as the
            source; do NOT search the web for a player whose file has an article. If the
            file says NO_WIKIPEDIA_PAGE (or RESOLVER_ERROR), use at most one web search
            for him (superliga.ro / Transfermarkt / the club site) and otherwise write
            the empty "checked" file described below.

            Follow the section "Fun facts biografice per jucător" in
            `.claude/skills/match-data-json/SKILL.md` (read it first): 3-6 facts, one
            sentence each, in Romanian (use the correct comma-below letters ș ț, never
            the cedilla ş ţ), every fact from a source you actually read (the player's
            Wikipedia page is the best single source; for Romanian players also
            superliga.ro, for others Transfermarkt / the club site), every changing
            number dated ("la data de ..."), no "first/record/return" claims unless the
            source says exactly that, no allegations or unconfirmed reports, nothing
            about private life beyond what a neutral reference states.

            Write ONE file per player: `docs/data/players/<apiId>.json`
            {"apiId": <number>, "name": "<name>", "funfacts": ["...", "..."],
             "sources": [{"name": "...", "url": "...", "accessed": "<today YYYY-MM-DD>"}],
             "updatedAt": "<today>"}
            If the file already exists it is a DRAFT from an earlier, less careful pass
            (it may contain wrong rounds, scores or garbled words): do not trust or reuse
            its facts, rewrite the whole file from the article.
            If you cannot find at least 2 reliable facts for a player, write the file
            with "funfacts": [] and "checkedAt": "<today>" instead of guessing — that
            marks him as looked-at so he is not retried for 60 days.

            Budget: the articles are already in the files, so this is mostly reading and
            writing; at most 10 web lookups in total, for players without an article.
            If you run short of turns, leave the remaining players for the next run (do
            not write files for them).

            ## Faithfulness (this is read on air; a wrong fact is worse than none)
            - Stay close to the article: one event per sentence; copy names, dates,
              numbers, scores and the ROUND of a match exactly as the article states
              them (do not turn a round of 16 into a quarter-final, do not merge two
              events, do not add context the article does not give).
            - Prefer plain, common Romanian words; never invent a word or a transliteration
              you are unsure of (say "faza eliminatorie", not a made-up term). Re-read every
              sentence once for typos and for anything the article does not literally support.
            - Valid JSON: never put a straight double quote inside a fact (use „ ” for
              nicknames/quotes, with the closing ” being U+201D).

            ## Strictly
            - Touch ONLY files under `docs/data/players/`. Do not edit match packs,
              fixtures or anything else; a script copies the facts into the packs.
            - Never invent. Fewer facts is fine, a wrong one is not.
            - Do not commit or push; the workflow does that afterwards.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 200
            --allowedTools "Read,Write,Edit,Bash,Glob,Grep,WebSearch,WebFetch"

      - name: Mark this run's files as the careful pass (rev 2)
        run: node scripts/stamp-player-facts.mjs

      - name: Copy the facts into the packs
        run: node scripts/apply-player-facts.mjs

      - name: Commit and push
        run: |
          git config user.name "player-facts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/players docs/data/matches
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Player facts: $(git diff --cached --name-only -- docs/data/players | wc -l) player file(s)"
            git pull --rebase --autostash origin main || true
            git push
          fi
