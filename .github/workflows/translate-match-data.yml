name: Translate Match Data

# Level 3: translates the editorial content of already-"ready" (or
# "premium"/deep) match packs into EN/DE/IT via a cheap OpenRouter model
# (scripts/translate-match-data-openrouter.mjs), writing a separate
# docs/data/matches/<slug>.i18n.json sidecar — the Romanian source file is
# never modified. This is pure mechanical translation of text a previous run
# already researched and verified, with no web access and no new facts, so
# it doesn't need Claude's research tools or the CLAUDE_CODE_OAUTH_TOKEN
# session budget (which it used to share with, and occasionally collide
# with, an interactive Claude Code session). Runs after Build Match Data so
# there's something ready to translate; harmless if it finds nothing to do.
# Only one run of this workflow executes at a time -- a second trigger
# (schedule vs. a manual dispatch, or two manual dispatches close together)
# queues behind the first instead of racing it. This narrows, but does not
# by itself close, the race below: `actions/checkout` pins the commit as of
# trigger time, not execution time, so a queued run can still start from a
# stale main. The real fix is in the commit step.
concurrency:
  group: translate-match-data
  cancel-in-progress: false

# 07:05, not 07:00: this was the only workflow left scheduled exactly on the hour, the
# time GitHub Actions itself warns is most likely to see cron runs delayed or dropped
# under load (every sibling workflow here is already offset by 5-30 min). Confirmed this
# wasn't just theoretical -- the 2026-09-20 07:00 run never shows up in the run history at
# all (no queued run, no failure, nothing), while every other workflow that morning ran on
# schedule.
on:
  schedule:
    - cron: "5 7 * * *"    # 07:05 UTC daily — after Build Match Data (06:00 UTC)
  workflow_dispatch:
    inputs:
      match:
        description: "Exact slug (e.g. seriea-e3-udinese-lazio). Empty = auto-pick."
        required: false
        default: ""
      count:
        description: "Max matches to translate this run when match is empty (daily schedule uses 50 — the display window already caps how many can qualify)"
        required: false
        default: "50"
      model:
        description: "OpenRouter model override. Default: a cheap/fast multilingual model (see OPENROUTER_TRANSLATE_MODEL secret, or the script's built-in default)."
        required: false
        default: ""

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Translate via OpenRouter
        id: translate
        env:
          MATCH: ${{ inputs.match || '' }}
          COUNT: ${{ inputs.count || '50' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ (inputs.model != '' && inputs.model) || secrets.OPENROUTER_TRANSLATE_MODEL || '' }}
        run: node scripts/translate-match-data-openrouter.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A concurrent run (schedule vs. manual dispatch, or two manual
          # dispatches) can start from the same stale main and pick the
          # same "untranslated" slugs, since actions/checkout pins the
          # commit as of trigger time, not execution time. If the other run
          # already pushed a file at one of our paths by now, it's a brand
          # new file on both sides with different content -- an add/add
          # conflict `git pull --rebase` cannot auto-resolve, which failed
          # a real run outright (detached HEAD, then a push with no branch
          # to push from). Fetch first and drop our copy of anything the
          # remote already has: the other run's translation wins, ours is
          # a wasted duplicate, not a real conflict to resolve.
          git fetch origin main
          for f in docs/data/matches/*.i18n.json; do
            [ -f "$f" ] || continue
            if git cat-file -e "origin/main:$f" 2>/dev/null; then
              echo "Dropping $f -- already present on origin/main (a concurrent run got there first)."
              rm -f "$f"
            fi
          done
          git add docs/data/matches/*.i18n.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          SLUGS="${{ steps.translate.outputs.slugs }}"
          if [ -n "$SLUGS" ]; then
            git commit -m "Translate match data: $SLUGS"
          else
            git commit -m "Translate match data"
          fi
          git pull --rebase --autostash origin main || true
          git push
