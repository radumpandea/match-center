name: Build Match Data (Fallback)

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      match:
        description: "Exact slug to process. Leave empty to process all fixtures scheduled for tomorrow."
        required: false
        default: ""
      model:
        description: "Model override (example: llama3.1, mistral, deepseek-r1)."
        required: false
        default: ""

jobs:
  build-match-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build via OpenAI-compatible model
        env:
          MATCH: ${{ github.event.inputs.match || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || github.event.inputs.model || 'meta-llama/llama-3.3-70b-instruct' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || github.event.inputs.model || 'meta-llama/llama-3.3-70b-instruct' }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || github.event.inputs.model || 'llama3.1' }}
        run: |
          if [ -n "${OPENROUTER_API_KEY}" ] && [ -z "${OPENROUTER_BASE_URL}" ]; then
            export OPENROUTER_BASE_URL="https://openrouter.ai/api/v1"
          fi
          if [ -n "${OPENAI_API_KEY}" ] && [ -z "${OPENAI_BASE_URL}" ]; then
            export OPENAI_BASE_URL="https://api.openai.com/v1"
          fi
          if [ -z "${OPENAI_API_KEY}" ] && [ -z "${OPENROUTER_API_KEY}" ] && [ -z "${OLLAMA_API_KEY}" ] && [ -z "${OPENAI_BASE_URL}" ] && [ -z "${OPENROUTER_BASE_URL}" ] && [ -z "${OLLAMA_BASE_URL}" ]; then
            echo "No fallback model credentials configured. Set OPENAI_API_KEY + OPENAI_BASE_URL, OPENROUTER_API_KEY, or OLLAMA_BASE_URL."
            exit 1
          fi
          python scripts/build-match-data-openai-compatible.py

      - name: Validate changed match files
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AM HEAD -- docs/data/matches | grep '\.json$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed match files to validate."
            exit 0
          fi
          node scripts/validate-match.mjs "${files[@]}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/matches docs/data/fixtures.json docs/data/previews.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Match data: fallback build"
          git push
