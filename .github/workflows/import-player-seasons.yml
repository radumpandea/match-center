name: Import Player Seasons

# Season-by-season record per player (apps, goals, ... per club and competition) from API-Football, in
# batches. A veteran costs ~12 calls, so this works through a queue a little at a time and stops at the
# API limits (see the header of scripts/import-player-seasons.mjs): MAX_CALLS per run, and never below
# RESERVE calls left for the day -- so it uses only what the prefetch and the lineup fetch leave over.
# It runs hourly in the quiet hours right after the daily quota resets (00:00 UTC) and does nothing once
# the day's allowance is down to the reserve.

on:
  schedule:
    - cron: "17 0-4 * * *"   # 00:17 ... 04:17 UTC, five batches
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Calls this run may use (default 300)"
        default: "300"
      reserve:
        description: "Stop when the day's remaining allowance drops to this (default 6300 of 7500)"
        default: "6300"
      only_slug:
        description: "Only the players of this match slug (optional)"
        default: ""

concurrency:
  group: import-player-seasons
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import the next batch of player seasons
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          MAX_CALLS: ${{ inputs.max_calls }}
          RESERVE: ${{ inputs.reserve }}
          ONLY_SLUG: ${{ inputs.only_slug }}
        run: node scripts/import-player-seasons.mjs

      - name: Commit if changed
        run: |
          git config user.name "player-seasons-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/seasons 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Player seasons: $(git diff --cached --name-only | wc -l) file(s)"
            # Only this job writes docs/data/seasons/, so a plain rebase never has a file to merge.
            ok=0
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
              sleep $((RANDOM % 10 + 8))
            done
            [ "$ok" = 1 ] || { echo "push failed after retries"; exit 1; }
          fi
