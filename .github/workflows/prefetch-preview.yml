name: Prefetch Preview Data

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC daily — 20 min after Refresh Fixtures
  workflow_dispatch:        # run on demand from the Actions tab
    inputs:
      backfill_history:
        description: "One-off: re-fetch formation/events for every already-ready match's h2h/form guide (see BACKFILL_HISTORY in prefetch-preview.mjs), instead of the normal daily pass"
        type: boolean
        default: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a cold run can do ~5000 throttled API-Football calls (~20 min); warm runs are minutes
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install validator dependencies
        run: npm install --no-audit --no-fund

      - name: Pre-fill docs/data/matches/*.json + docs/data/teams/*.json from API-Football
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          INOREADER_APP_ID: ${{ secrets.INOREADER_APP_ID }}
          INOREADER_APP_KEY: ${{ secrets.INOREADER_APP_KEY }}
          INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
          BACKFILL_HISTORY: ${{ inputs.backfill_history && '1' || '' }}
        run: node scripts/prefetch-preview.mjs

      - name: Validate every partial pack against the schema
        run: |
          shopt -s nullglob
          files=(docs/data/matches/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            node scripts/validate-match.mjs "${files[@]}"
          else
            echo "No match files to validate."
          fi

      - name: Commit if changed
        run: |
          git config user.name "preview-prefetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/teams docs/data/matches docs/data/previews.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Prefetch preview data ($(date -u +%Y-%m-%d))"
            # Other workflows (deep builds, completion, facts) commit to the same packs while this one
            # runs -- it starts late, around the time they land. `pull --rebase -X theirs` merged such a
            # pack line by line and left a file that was neither version (invalid JSON schema, which then
            # failed every later run). So never merge a file: a pack that changed upstream while we ran
            # keeps the upstream version (the prefetch is deterministic and refreshes it on the next run);
            # every other file is taken whole from this run's commit.
            PREFETCH=$(git rev-parse HEAD)
            BASE=$(git rev-parse HEAD~1)
            git diff --name-only --diff-filter=ACMR "$BASE" "$PREFETCH" | sort -u > "$RUNNER_TEMP/mine.txt"
            ok=0
            for i in 1 2 3 4; do
              git fetch origin main
              git diff --name-only "$BASE" origin/main | sort -u > "$RUNNER_TEMP/theirs.txt"
              git checkout -q -f -B publish origin/main
              comm -23 "$RUNNER_TEMP/mine.txt" "$RUNNER_TEMP/theirs.txt" > "$RUNNER_TEMP/take.txt"
              echo "taking $(wc -l < "$RUNNER_TEMP/take.txt") file(s) from this run; keeping upstream for $(comm -12 "$RUNNER_TEMP/mine.txt" "$RUNNER_TEMP/theirs.txt" | wc -l) changed meanwhile"
              xargs -r -a "$RUNNER_TEMP/take.txt" git checkout "$PREFETCH" --
              if git diff --cached --quiet; then echo "Nothing left to commit."; ok=1; break; fi
              git commit -q -m "Prefetch preview data ($(date -u +%Y-%m-%d))"
              if git push origin HEAD:main; then ok=1; break; fi
              sleep $((RANDOM % 10 + 8))
            done
            [ "$ok" = 1 ] || { echo "push failed after retries"; exit 1; }
          fi
