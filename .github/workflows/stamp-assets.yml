name: Stamp asset versions

# docs/app/*.js|css can change in a commit without the ?v= in the HTML changing, and Pages caches assets for
# 10 minutes, so browsers keep the old script. This re-stamps the content hashes (scripts/stamp-assets.mjs)
# after every push that touches them and commits the HTML if anything was stale.

on:
  push:
    branches: [main]
    paths:
      - "docs/app/**"
      - "docs/*.html"
  workflow_dispatch: {}

concurrency:
  group: stamp-assets
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/stamp-assets.mjs
      - name: Commit if changed
        run: |
          git config user.name "asset-stamp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/*.html
          if git diff --cached --quiet; then
            echo "Versions already up to date."
          else
            git commit -m "Stamp asset versions"
            git pull --rebase --autostash origin main || true
            git push
          fi
