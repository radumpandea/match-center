name: Build Match Data

on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC daily (08:00 Europe/Bucharest) — after fixture refresh + prefetch
  workflow_dispatch:
    inputs:
      model:
        description: "Model for the editorial pass (default: Haiku 4.5)"
        required: false
        default: "claude-haiku-4-5-20251001"

jobs:
  build-match:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install validator dependencies
        run: npm install --no-audit --no-fund

      - uses: anthropics/claude-code-action@v1
        env:
          # An identity-linked Anthropic API key (the newer default for keys created
          # via personal login) rejects requests unless the acting workspace is named.
          # Set the ANTHROPIC_WORKSPACE_ID repo secret (format: wrkspc_...) and it is
          # sent as a header; leave it unset for a plain workspace-scoped key.
          ANTHROPIC_CUSTOM_HEADERS: "${{ secrets.ANTHROPIC_WORKSPACE_ID && format('anthropic-workspace-id: {0}', secrets.ANTHROPIC_WORKSPACE_ID) || '' }}"
        with:
          # Provide ONE of these two secrets. Prefer ANTHROPIC_API_KEY: it is
          # billed per token and has no session cap, which a daily unattended
          # run needs. CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) uses the
          # Claude subscription, whose rolling 5-hour session limit this job hit
          # on 2026-09-04 ("You've hit your session limit"); it is only used here
          # when ANTHROPIC_API_KEY is unset.
          anthropic_api_key: "${{ secrets.ANTHROPIC_API_KEY }}"
          claude_code_oauth_token: "${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}"
          show_full_output: true
          prompt: |
            You are the Level 2 editorial pass for a small football Match Center
            site (radumpandea.github.io/match-center). You run once a day,
            unattended, no memory of a previous run, nobody reviewing the output.
            Everything you need is in this repo and this prompt.

            ## Critical: do the work yourself, now — there is no "later"
            This is a single one-shot run. The moment your final response is
            produced, the job exits — nothing runs after that. Do NOT use the Task
            tool or any background/async agent. Do every step yourself, directly,
            in this same turn: research, edit the JSON files, update
            fixtures.json, git commit and push — all before your final answer.

            ## What Level 1 already did (do NOT redo it)
            `scripts/prefetch-preview.mjs` runs daily, deterministically, and has
            already written `docs/data/matches/<slug>.json` for upcoming fixtures
            with `"partial": true`. It fills, and you must TRUST (verify only if a
            value looks obviously wrong, don't re-derive):
            - `teams.<side>.squad[]` — full squads, shirt no., age, nat, height,
              position, season goals/assists/cards/rating, and `career` for the
              recent-lineup players;
            - `teams.<side>.form` — `last5`, `table` (standings row), `recent`
              (form guide), `position`;
            - `h2h.recent[]` + `h2h.summary`;
            - `venue`, `referee.name`, `teams.<side>.coach.name`, injuries in
              `absences[]`, `confirmedXI` when the lineup was public;
            - `storyOfTheMatch` — a few FACTUAL seed bullets computed from the
              numbers (standings, streaks, top scorer);
            - `teams.<side>.newsCandidates[]` — raw dated RSS headlines.

            ## Your job today
            1. Read `docs/data/fixtures.json`. Pick **up to 2** entries that
               (a) have `ready: false`, (b) whose `docs/data/matches/<slug>.json`
               exists AND still has `"partial": true`, (c) kick off soonest,
               within the next **3 days** (Europe/Bucharest). If none qualify,
               STOP — no commit. That is the normal outcome most days.
            2. For each picked match, edit its file IN PLACE, following
               `.claude/skills/match-data-json/SKILL.md` as the editorial layer.
               You may ONLY add/change these fields:
               - `storyOfTheMatch`: keep the factual seed bullets, merge/rephrase
                 for tone, add AT MOST 3 genuinely-researched angles → 6–10 total.
               - `teams.<side>.stories[]`: 2–3 punchy bars per team.
               - `funfact` / `linkLine`: only for the ~11 likely starters of each
                 side plus anyone a story touches. The rest stay `null`.
               - `news[]`: triage `newsCandidates` — keep only match-relevant,
                 ≤2–3 days old; rewrite in Romanian, paraphrased. Then DELETE the
                 `newsCandidates` arrays.
               - `coach.career` / `coach.country` / `coach.age` / `coach.tenureFrom`
                 if empty (Wikipedia manager infobox).
               - `mercatoIn[]` / `mercatoOut[]`, `preseason[]` — if quickly found.
               - `stats.minutes` / `stats.apps` for the likely XI (FBref "All
                 Competitions" club page — one page per club covers the whole XI).
               - `venue.capacity` / `venue.city`, `referee` age/averages — ONLY if
                 trivially found; otherwise leave as-is.
               - `colors`, `shortName` if known.
               Do NOT rewrite squads, form, h2h, or the confirmed lineup.
               FINALLY: remove the `"partial"` key from the object.
            3. `node scripts/validate-match.mjs docs/data/matches/<slug>.json` must
               exit 0 for each file. `!` warnings about predictedXI count or squad
               size are EXPECTED on these packs — don't chase them. Fix every `✗`.
            4. Set `ready: true` on those entries in `docs/data/fixtures.json`;
               correct `round` / `ko` / `kickoff` / `venue` only if clearly wrong.
               Touch no other entry.

            ## Lookup budget — this is a hard limit
            About **12 web lookups per match**, total. Quality within the budget
            beats exhaustive coverage. Typical spend: 1 match-preview page, 1–2
            team-news pages, 2 Wikipedia coach pages, 2 FBref club pages, 1–2 for
            funfacts, 1 SoccerStats for goal stats. Do NOT verify squads player by
            player — Level 1 already did that.

            ## Accuracy
            - Never invent a fact, statistic, height, or career detail. Missing →
              `null` / `"n/d"`, never a guess.
            - "first time" / "record" / "return to" needs a source that says
              exactly that; otherwise state the plain fact.
            - News items must be dated within 2–3 days of today.
            - On a squad/lineup/stat conflict, prefer the official source.

            ## Finishing up
            - Commit only files you actually produced + the fixtures.json edit,
              in ONE commit ("Match data: <match1>[, <match2>]"). Push to `main`.
          claude_args: |
            --model ${{ github.event.inputs.model || 'claude-haiku-4-5-20251001' }}
            --max-turns 120
            --allowedTools "Read,Write,Edit,Bash,Glob,Grep,WebSearch,WebFetch"
