name: Build Match Data

on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC daily (09:00 Europe/Bucharest) — after fixture refresh + prefetch
  workflow_dispatch:
    inputs:
      match:
        description: "Exact slug (e.g. seriea-e3-udinese-lazio). Empty = daily auto-pick of up to 2."
        required: false
        default: ""
      depth:
        description: "standard (fast, ~12 lookups, up to 2 matches) or deep (Sonnet, ~50 lookups, ONE match, full commentator dossier)"
        required: false
        type: choice
        options:
          - standard
          - deep
        default: standard
      model:
        description: "Model override (empty = derived from depth: standard→Haiku, deep→Sonnet)"
        required: false
        default: ""

# The daily auto-pick (up to 2 nearest not-yet-ready matches, standard depth)
# or a manual one-off run. See build-match-data-favourites.yml for the
# separate, favourite-driven deep passes — this file only ever does what's
# asked here (auto-pick or the exact match/depth given).
jobs:
  build-match:
    # Must mirror the permissions build-match-data-run.yml's job requests —
    # a reusable-workflow call that asks for more than the caller job grants
    # fails at startup (0 jobs run), it doesn't just downgrade silently.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/build-match-data-run.yml
    with:
      match: ${{ github.event.inputs.match || '' }}
      depth: ${{ github.event.inputs.depth || 'standard' }}
      model: ${{ github.event.inputs.model || '' }}
    secrets: inherit
