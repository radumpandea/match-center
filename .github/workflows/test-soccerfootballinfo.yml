name: Test SoccerFootballInfo Referees (one-off)

# Diagnostic only, not part of the pipeline. Spends exactly one call against
# the free-tier 8/hr limit to check whether soccer-football-info.p.rapidapi.com
# has referee data for today's Match Center fixtures. Delete this file (and
# scripts/test-soccerfootballinfo.mjs) once the question is answered.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Query today's matches and check referee coverage
        env:
          SOCCERFOOTBALLINFO_KEY: ${{ secrets.SOCCERFOOTBALLINFO_KEY }}
        run: node scripts/test-soccerfootballinfo.mjs
